server:
  port: 8888
spring:
  application:
    name: gateway-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:9999}"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              include-expression: "serviceId == 'CUSTOMER-SERVICE' || serviceId == 'INVENTORY-SERVICE' || serviceId == 'BILLING-SERVICE'"
