spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "${FRONTEND_ORIGIN:http://localhost:4200}"
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Accept, Content-Type, If-Match, If-None-Match]
                exposed-headers: [Location, ETag]
